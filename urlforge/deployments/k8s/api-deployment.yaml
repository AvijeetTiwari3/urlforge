apiVersion: apps/v1
kind: Deployment
metadata:
  name: urlforge-api
  labels:
    app: urlforge
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: urlforge
      tier: api
  template:
    metadata:
      labels:
        app: urlforge
        tier: api
    spec:
      containers:
        - name: api
          image: urlforge-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: urlforge-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis-service:6379"
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: urlforge-api-service
spec:
  selector:
    app: urlforge
    tier: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urlforge-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urlforge-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
